# ==========================================
#   TirnueWaypoints v1.0.0 - Configuration
# ==========================================

# ------------------------------------------
# Teleportation Settings
# ------------------------------------------
teleport:
  # Minimum warmup time in seconds (regardless of distance)
  base-warmup-seconds: 3.0
  # Additional seconds per 100 blocks of distance
  seconds-per-100-blocks: 1.0
  # Maximum warmup cap in seconds
  max-warmup-seconds: 15.0
  # Fixed warmup for cross-dimension travel (overworld <-> nether, etc.)
  cross-dimension-seconds: 12.0
  # Cancel teleport if player moves more than this many blocks
  cancel-on-move: true
  move-threshold: 0.5
  # Cancel teleport if player takes damage
  cancel-on-damage: true
  # Cooldown between warps (seconds)
  cooldown-seconds: 60
  # VIP cooldown multiplier (0.5 = half the cooldown)
  vip-cooldown-multiplier: 0.5

# ------------------------------------------
# Teleportation Cost (Admin Configurable)
# ------------------------------------------
cost:
  # Enable or disable teleport costs
  enabled: false
  # Cost type: ECONOMY, XP, or ITEM
  type: ECONOMY
  # Economy: base flat fee per warp
  economy-base-cost: 0.0
  # Economy: additional cost per 100 blocks distance
  economy-per-100-blocks: 5.0
  # Economy: maximum cost cap (0 = no cap)
  economy-max-cost: 500.0
  # XP: levels consumed per warp
  xp-levels-per-warp: 1
  # Item: material consumed per warp
  item-type: ENDER_PEARL
  item-amount: 1
  # Are global (admin) waypoints free to use?
  global-waypoints-free: true

# ------------------------------------------
# Waypoint Limits
# ------------------------------------------
limits:
  # Max waypoints a default player can place
  default-max-waypoints: 2
  # Max outgoing links per waypoint (default player)
  default-max-links: 3
  # VIP max waypoints
  vip-max-waypoints: 5
  # VIP max links per waypoint
  vip-max-links: 6

# ------------------------------------------
# Waypoint Core Item
# ------------------------------------------
core-item:
  # Material used as the "Waypoint Core" placeable item
  material: LODESTONE
  # Custom display name (color codes supported)
  name: "&d✦ Waypoint Core"
  # Lore lines
  lore:
    - "&7Place this on the ground to create"
    - "&7a magical travel waypoint."
    - ""
    - "&8[&eRight-Click&8] &7to place"

# ------------------------------------------
# Visual / Structure Settings
# ------------------------------------------
visuals:
  # Block used for the waypoint base
  base-block: CRYING_OBSIDIAN
  # Block/item used for the floating core crystal
  core-item: AMETHYST_SHARD
  # Rotation speed of the floating crystal (degrees per tick, 20 ticks = 1 second)
  crystal-rotation-speed: 2.0
  # Bobbing amplitude (how high/low the crystal bobs)
  crystal-bob-amplitude: 0.15
  # Show ambient idle particles around waypoints
  ambient-particles: true
  # Ambient particle type
  ambient-particle: ENCHANT
  # Proximity sound cue when a player walks near any waypoint
  proximity-sound: true
  # Radius for proximity sound
  proximity-radius: 15

# ------------------------------------------
# Teleport FX (Channeling Visuals & Audio)
# ------------------------------------------
teleport-fx:
  # Particle used during channeling warmup
  channeling-particle: PORTAL
  # Departure flash particle
  departure-particle: FLASH
  # Arrival particle
  arrival-particle: REVERSE_PORTAL
  # Sound during channeling (plays each tick, pitch ramps up)
  channeling-sound: BLOCK_BEACON_AMBIENT
  # Sound on departure
  departure-sound: ENTITY_ENDERMAN_TELEPORT
  # Sound on arrival
  arrival-sound: BLOCK_RESPAWN_ANCHOR_SET_SPAWN

# ------------------------------------------
# Link Receipt / Attunement Ledger
# ------------------------------------------
ledger:
  # Material used for the physical link receipt item
  material: WRITTEN_BOOK
  # Display name
  name: "&d✦ Waypoint Attunement Ledger"

# ------------------------------------------
# Messages (all support & color codes)
# ------------------------------------------
messages:
  prefix: "&8[&b✦&8] "
  waypoint-created: "&aWaypoint &e{name} &acreated successfully!"
  waypoint-removed: "&cWaypoint &e{name} &cremoved."
  waypoint-renamed: "&aWaypoint renamed to &e{name}&a."
  trust-added: "&a{player} &7has been trusted on &e{waypoint}&7."
  trust-removed: "&c{player} &7has been removed from &e{waypoint}&7."
  link-established: "&a✦ Connection established with &e{waypoint}&a!"
  link-revoked: "&c✦ Connection to &e{waypoint} &csevered."
  link-request-received: "&b✦ &e{owner} &7wants to link &f{waypoint} &7to your waypoint!"
  teleport-start: "&b✦ Warping to &e{destination} &7» &b{time}s"
  teleport-cancelled-move: "&c✖ Teleport cancelled! You moved."
  teleport-cancelled-damage: "&c✖ Teleport cancelled! You took damage."
  teleport-success: "&a✦ Arrived at &e{destination}&a!"
  teleport-cooldown: "&c✖ Warp cooldown! Wait &e{seconds}s&c."
  no-permission: "&c✖ You do not have permission to use this waypoint."
  max-waypoints: "&c✖ You have reached your maximum waypoint limit ({max})."
  max-links: "&c✖ This waypoint has reached its maximum link limit ({max})."
  not-enough-money: "&c✖ Not enough money! Cost: &e${cost}"
  not-enough-xp: "&c✖ Not enough XP levels! Need: &e{levels}"
  not-enough-items: "&c✖ You need &e{amount}x {item} &cto warp."
  ledger-generated: "&a✦ Link receipt created for &e{waypoint}&a!"
  ledger-invalid: "&c✖ This ledger is invalid or has already been used."
  waypoint-destroyed-notify: "&c✦ {waypoint} has been dismantled. Connection lost."
